[project]
name = "cafemesh-ai"
version = "0.1.0"
description = "A trustworthy, synthetic-data café intelligence demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "google-adk>=1.39.1,<2",
  "google-genai>=2.9,<3",
  "google-cloud-firestore>=2.16,<3",
  "google-cloud-texttospeech>=2.31,<3",
  "google-auth>=2.35,<3",
  "httpx>=0.27,<1",
  "starlette>=1.3.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

"15" font-weight="400" fill="#626D7E" text-anchor="middle">HTTPS</text><polyline points="225,210 225,176 1360,176 1360,210" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="664.0" y="161" width="252.0" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="790" y="178" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Google Identity Services sign-in</text><polyline points="765,340 765,455" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="689.8828125" y="352" width="150.234375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="765" y="369" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">HTTPS · app + API</text><polyline points="970,475 1080,475 1080,287 1180,287" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="997.25" y="258" width="145.5" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1070" y="275" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Token verification</text><polyline points="970,555 1180,555" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="1018.28125" y="525" width="113.4375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1075" y="542" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">HTTPS / JSON</text><polyline points="970,635 1080,635 1080,777 1180,777" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="1041.296875" y="740" width="77.40625" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1080" y="757" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Optional</text><polyline points="765,665 765,805" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="668.0546875" y="725" width="193.890625" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="765" y="742" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Snapshot read / commit</text><polyline points="560,625 450,625 450,882 390,882" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="399.9140625" y="750" width="100.171875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="450" y="767" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Local mode</text><rect x="60" y="445" width="330" height="155" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="460" width="4" height="125" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="83" y="475" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">DEPLOYMENT CONFIG (DOCS)</text><text x="83" y="508" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Secret Manager</text><text x="83" y="539" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Supplies the server-side Maps key.</text><text x="83" y="564" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626D7E" text-anchor="start">Access per deployment documentation.</text><polyline points="390,520 560,520" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="409.6484375" y="490" width="130.703125" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="475" y="507" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Inject Maps key</text><text x="60" y="670" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Public customer endpoints.</text><text x="60" y="700" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Cloud Run origin is also public.</text><text x="60" y="730" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Reviewer token checks are in-app.</text><text x="1180" y="916" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Model access: ADC / runtime identity.</text><text x="1180" y="945" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">API-key mode is also supported.</text><text x="60" y="1050" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Documented settings: max instances = 1; concurrency = 1; runtime identity with Firestore / Vertex / secret access. Not re-queried here.</text><text x="60" y="1080" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">The SPA, saved MP3s, MP4s and poster assets are bundled in the image. Playback makes no runtime TTS request (see view 08).</text><text x="60" y="1110" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Local development uses Vite :5173 → FastAPI :8000; the packaged app serves both UI and API from one origin.</text><text x="60" y="1140" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No tenant isolation or café staff roles. Provider status combines configuration and last observations; it is not a fresh health probe.</text><text x="60" y="1170" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Code confirms provider adapters and env-based configuration. Region, deployed settings, OAuth audience and IAM grants are documentary evidence.</text><polyline points="60,1240 103,1240" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><text x="116" y="1246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Application / data flow</text><polyline points="410,1240 453,1240" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><text x="466" y="1246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">AI / advisory exchange</text><rect x="790" y="1231" width="20" height="20" rx="5" fill="#FFF3E6" stroke="#B86023" stroke-width="1.5"/><text x="822" y="1246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Human decision</text><rect x="1090" y="1231" width="20" height="20" rx="5" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><text x="1122" y="1246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">External system / local mode</text></svg>
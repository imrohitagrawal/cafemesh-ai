="#202B41" text-anchor="start">Cloudflare Worker</text><text x="583" y="304" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Custom hostname → origin proxy</text><rect x="560" y="455" width="410" height="210" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="560" y="470" width="4" height="180" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="583" y="485" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">SINGLE APPLICATION CONTAINER</text><text x="583" y="518" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">FastAPI on Cloud Run</text><text x="583" y="549" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Serves built SPA + JSON API.</text><text x="583" y="574" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Contracts, policy and coordination.</text><text x="583" y="599" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Verifies reviewer ID tokens.</text><text x="583" y="624" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">ADK executes in this process.</text><rect x="560" y="805" width="410" height="155" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="560" y="820" width="4" height="125" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="583" y="835" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">HOSTED SYNTHETIC STATE</text><text x="583" y="868" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Firestore snapshot</text><text x="583" y="899" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">One serialized SQLite snapshot.</text><text x="583" y="924" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Compare-and-set · 700 KB ceiling.</text><rect x="1180" y="210" width="360" height="155" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1180" y="225" width="4" height="125" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="1203" y="240" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">IDENTITY PROVIDER</text><text x="1203" y="273" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Google Identity</text><text x="1203" y="304" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Browser sign-in → ID token.</text><text x="1203" y="329" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">OAuth Testing: documented setting.</text><rect x="1180" y="455" width="360" height="155" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1180" y="470" width="4" height="125" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="1203" y="485" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">GOOGLE MAPS PLATFORM</text><text x="1203" y="518" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Places + Routes</text><text x="1203" y="549" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Server-side API-key requests.</text><text x="1203" y="574" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Directory data + walking routes.</text><rect x="1180" y=
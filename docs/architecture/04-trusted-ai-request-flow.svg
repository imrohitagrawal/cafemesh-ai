<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" role="img"><title>CaféMesh AI — 04-trusted-ai-request-flow</title><defs><marker id="F3F5F8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#F3F5F8" stroke-width="1.5"/></marker><marker id="7953AF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#7953AF" stroke-width="1.5"/></marker><marker id="D8DFE8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#D8DFE8" stroke-width="1.5"/></marker><marker id="FFFFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></marker><marker id="F5F0FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#F5F0FC" stroke-width="1.5"/></marker><marker id="FFF3E6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#FFF3E6" stroke-width="1.5"/></marker><marker id="B86023" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B86023" stroke-width="1.5"/></marker><marker id="788494" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#788494" stroke-width="1.5"/></marker><marker id="477453" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#477453" stroke-width="1.5"/></marker><marker id="202B41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#202B41" stroke-width="1.5"/></marker><marker id="626D7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#626D7E" stroke-width="1.5"/></marker><marker id="285DA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#285DA0" stroke-width="1.5"/></marker><marker id="EDF4FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#EDF4FC" stroke-width="1.5"/></marker><marker id="506882" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#506882" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1530" rx="0" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="60" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#477453" text-anchor="start">CAFÉMESH AI  /  ARCHITECTURE</text><text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#202B41" text-anchor="start">Trusted AI · From request to simulated order</text><text x="60" y="141" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#626D7E" text-anchor="start">Implemented request controls and explicit limits, checked against main.py and service.py.</text><rect x="1320" y="31" width="220" height="34" rx="8" fill="#EDF4FC" stroke="transparent" stroke-width="1.5"/><text x="1430" y="54" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#285DA0" text-anchor="middle">CURRENT CODE</text><polyline points="60,1451 1540,1451" fill="none" stroke="#D8DFE8" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1497" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626D7E" text-anchor="start">CODE-REVIEWED  •  26 SEP 2026  •  SOURCE 76134e6</text><text x="1540" y="1497" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#202B41" text-anchor="end">04 / 09</text><rect x="80" y="195" width="740" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="80" y="210" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="103" y="225" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">1   Validate customer input</text><text x="103" y="256" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">POST /api/recommend · structured schema and explicit constraints</text><rect x="80" y="385" width="740" height="155" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="80" y="400" width="4" height="125" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="103" y="415" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">2   Retrieve facts &amp; apply deterministic policy</text><text x="103" y="446" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Lexical menu matching · budget / diet / allergy / time constraints</text><text x="103" y="471" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Evidence IDs + eligibility + staff-review status</text><text x="103" y="496" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Record recommendation and safety events.</text><rect x="1000" y="385" width="500" height="195" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1000" y="400" width="4" height="165" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="1023" y="415" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#7953AF" text-anchor="start">ADVISORY BRANCH</text><text x="1023" y="448" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">Optional ADK + Gemini</text><text x="1023" y="479" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Only when configured and candidates exist.</text><text x="1023" y="504" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Read-only menu, visit and owner fact tools.</text><text x="1023" y="529" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Interprets and explains supplied facts.</text><text x="1023" y="554" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No order-write authority.</text><rect x="80" y="685" width="740" height="130" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="80" y="700" width="4" height="100" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="103" y="715" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">3   Return structured result</text><text x="103" y="746" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Candidates · evidence · eligibility · provider status</text><text x="103" y="771" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Unknown / stale allergy evidence requires staff review.</text><rect x="1000" y="685" width="500" height="155" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1000" y="700" width="4" height="125" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="1023" y="715" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">Model summary guard</text><text x="1023" y="746" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Withhold narrative for declared allergies OR</text><text x="1023" y="771" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">matched allergy-safety wording.</text><text x="1023" y="796" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Keep structured candidates authoritative.</text><rect x="80" y="900" width="740" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="80" y="915" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="103" y="930" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">4   Validate and persist exact preview</text><text x="103" y="961" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">POST /api/preview · bound item, quantity, price and constraints</text><rect x="1000" y="900" width="500" height="110" rx="14" fill="#FFF3E6" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1000" y="915" width="4" height="80" rx="2" fill="#B86023" stroke="transparent" stroke-width="1.5"/><text x="1023" y="930" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">5   Customer explicitly confirms</text><text x="1023" y="961" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">The displayed proposal + an idempotency key.</text><rect x="1000" y="1110" width="500" height="135" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1000" y="1125" width="4" height="105" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1023" y="1140" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">6   Backend action gate</text><text x="1023" y="1171" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Unused, unchanged snapshot + current constraints.</text><text x="1023" y="1196" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Prior key returns prior order before payload checks.</text><text x="1023" y="1221" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No safety-age recheck or proposal TTL.</text><rect x="80" y="1110" width="740" height="135" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="80" y="1125" width="4" height="105" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="103" y="1140" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">7   Commit simulated order &amp; event</text><text x="103" y="1171" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Mark proposal confirmed and return the synthetic order ID.</text><text x="103" y="1196" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No payment, POS or fulfillment integration.</text><polyline points="450,305 450,385" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="363.9765625" y="333" width="172.046875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="450" y="350" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Validated constraints</text><polyline points="450,540 450,685" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="325.75" y="579" width="248.5" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="450" y="596" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">No candidates → no generation</text><rect x="287.125" y="613" width="325.75" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="450" y="630" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">AI unconfigured → deterministic response</text><polyline points="820,460 1000,460" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="844.2578125" y="428" width="131.484375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="910" y="445" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Facts + request</text><polyline points="1250,580 1250,685" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="1162.8515625" y="620" width="174.296875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1250" y="637" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Untrusted model text</text><polyline points="1000,750 820,750" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="853.578125" y="718" width="112.84375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="910" y="735" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Guarded text</text><polyline points="450,815 450,900" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="350.78125" y="841" width="198.4375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="450" y="858" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Select eligible candidate</text><polyline points="820,955 1000,955" fill="none" stroke="#B86023" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#B86023)"/><rect x="848.1953125" y="922" width="123.609375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="910" y="939" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#B86023" text-anchor="middle">Show proposal</text><polyline points="1250,1010 1250,1110" fill="none" stroke="#B86023" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#B86023)"/><rect x="1184.9140625" y="1043" width="130.171875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1250" y="1060" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#B86023" text-anchor="middle">Explicit confirm</text><polyline points="1000,1175 820,1175" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="856.4765625" y="1143" width="107.046875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="910" y="1160" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Checks pass</text><text x="80" y="1290" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Configured provider failures return explicit errors (502 / 503 / 504); they are not silently reported as successful demo responses.</text><text x="80" y="1330" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Review gap: recommendation checks safety-record age, but preview / confirm do not repeat that check. Staff review is a status, not a resolver.</text><text x="80" y="1360" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Availability is checked, but inventory units are not reserved or decremented. Confirmation remains a synthetic write only.</text><polyline points="60,1411 103,1411" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><text x="116" y="1417" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Application / data flow</text><polyline points="410,1411 453,1411" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><text x="466" y="1417" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">AI / advisory exchange</text><rect x="790" y="1402" width="20" height="20" rx="5" fill="#FFF3E6" stroke="#B86023" stroke-width="1.5"/><text x="822" y="1417" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Human decision</text><rect x="1090" y="1402" width="20" height="20" rx="5" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><text x="1122" y="1417" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">External system / local mode</text></svg>
er><marker id="202B41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#202B41" stroke-width="1.5"/></marker><marker id="626D7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#626D7E" stroke-width="1.5"/></marker><marker id="285DA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#285DA0" stroke-width="1.5"/></marker><marker id="EDF4FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#EDF4FC" stroke-width="1.5"/></marker><marker id="506882" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#506882" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1620" rx="0" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="60" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#477453" text-anchor="start">CAFÉMESH AI  /  ARCHITECTURE</text><text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#202B41" text-anchor="start">State · Persistence &amp; controlled learning</text><text x="60" y="141" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#626D7E" text-anchor="start">All eight stored record types, their persistence boundary, and the implemented learning loops.</text><rect x="1320" y="31" width="220" height="34" rx="8" fill="#EDF4FC" stroke="transparent" stroke-width="1.5"/><text x="1430" y="54" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#285DA0" text-anchor="middle">CURRENT CODE</text><polyline points="60,1541 1540,1541" fill="none" stroke="#D8DFE8" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1587" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626D7E" text-anchor="start">CODE-REVIEWED  •  26 SEP 2026  •  SOURCE 76134e6</text><text x="1540" y="1587" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#202B41" text-anchor="end">06 / 09</text><rect x="60" y="185" width="460" height="180" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="200" width="4" height="150" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="83" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">REFERENCE FACTS</text><text x="83" y="248" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Synthetic business fixtures</text><text x="83" y="279" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">data.py · CAFE / MENU / QUEUE / ZONES</text><text x="83" y="304" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Prices, allergens, stock and occupancy</text><text x="83" y="329" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">These are code fixtures, not Firestore tables.</text><rect x="650" y="185" width="890" height="180" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="650" y="200" width="4" height="150" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="673" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">SHARED SYNTHETIC WORKFLOW</text><text x="673" y="248" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">Application commands &amp; read models</text><text x="673" y="279" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">main.py + service.py + observability.py</text><text x="673" y="304" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Recommendation / preview / confirm / transition / feedback / decision / reset</text><text x="673" y="329" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Ops and Owner read the same records; recommendations are events.</text><polyline points="520,270 650,270" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="528.4765625" y="239" width="113.046875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="585" y="256" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Read fixtures</text><rect x="60" y="455" width="1480" height="365" rx="18" fill="#FBFCFE" stroke="#D8DFE8" stroke-width="1.5" stroke-dasharray="8 7"/><text x="80" y="484" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#626D7E" text-anchor="start">LOGICAL TABLES  /  IDs AND JSON PAYLOAD LINKS; NO DECLARED FOREIGN-KEY RELATIONSHIPS</text><rect x="90" y="520" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="90" y="535" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="113" y="550" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">orders</text><text x="113" y="581" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Order ID · unique idempotency key</text><rect x="450" y="520" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="450" y="535" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="473" y="550" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">proposals</text><text x="473" y="581" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Proposal ID · snapshot · confirmed</text><rect x="810" y="520" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="810" y="535" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="833" y="550" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">preferences</text><text x="833" y="581" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Customer ID · bounded profile</text><rect x="1170" y="520" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1170" y="535" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1193" y="550" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">feedback</text><text x="1193" y="581" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Customer ID · feedback payload</text><rect x="90" y="680" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="90" y="695" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="113" y="710" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">prep_observations</text><text x="113" y="741" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Predicted / actual · source tag</text><rect x="450" y="680" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="450" y="695" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="473" y="710" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">events</text><text x="473" y="741" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Kind · JSON data · created_at</text><rect x="810" y="680" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="810" y="695" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="833" y="710" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">decisions</text><text x="833" y="741" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Recommendation · accept / reject</text><rect x="1170" y="680" width="330" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1170" y="695" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1193" y="710" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">activity</text><text x="1193" y="741" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Agent / tool · evidence · latency</text><polyline points="1095,365 1095,455" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="1016.59375" y="397" width="156.8125" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1095" y="414" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Read / write / audit</text><rect x="590" y="900" width="420" height="110" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="590" y="915" width="4" height="80" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="613" y="930" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">db.py · backend selector</text><text x="613" y="961" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">CAFEMESH_STORAGE_BACKEND</text><polyline points="800,820 800,900" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="60" y="1090" width="590" height="170" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="1105" width="4" height="140" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="1120" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Hosted: Cloud Firestore</text><text x="83" y="1151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">cafemesh_state/demo · sqlite_snapshot payload</text><text x="83" y="1176" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Deserialize into in-memory SQLite; serialize on commit.</text><text x="83" y="1201" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Compare-and-set; 700,000-byte decoded payload cap.</text><text x="83" y="1226" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">One instance / concurrency one remains a demo constraint.</text><rect x="950" y="1090" width="590" height="170" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="950" y="1105" width="4" height="140" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="973" y="1120" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Local: SQLite file</text><text x="973" y="1151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Default: data/cafemesh.db</text><text x="973" y="1176" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Same logical schema and SQL service boundary.</text><text x="973" y="1201" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Local development alternative, not a second hosted store.</text><polyline points="700,1010 700,1050 355,1050 355,1090" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="471.765625" y="1023" width="76.46875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="510" y="1040" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">firestore</text><polyline points="900,1010 900,1050 1245,1050 1245,1090" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="1072.609375" y="1023" width="54.78125" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1100" y="1040" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">sqlite</text><text x="60" y="1320" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#626D7E" text-anchor="start">LEARNING AND REVIEW OVER THE SAME SHARED RECORDS</text><rect x="60" y="1360" width="460" height="140" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="1375" width="4" height="110" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="1390" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Taste preferences</text><text x="83" y="1421" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Feedback adjusts four bounded taste weights.</text><text x="83" y="1446" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Ranking uses these weights; safety is excluded.</text><text x="83" y="1471" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No separate customer profiles or consent API.</text><rect x="560" y="1360" width="460" height="140" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="560" y="1375" width="4" height="110" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="583" y="1390" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Measured timing</text><text x="583" y="1421" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Latest 20 measured samples; default minimum 3.</text><text x="583" y="1446" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Seeded samples never calibrate estimates.</text><text x="583" y="1471" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Total-time / prep-time mismatch: see audit.</text><rect x="1060" y="1360" width="480" height="140" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1060" y="1375" width="4" height="110" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="1083" y="1390" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">AI review signals</text><text x="1083" y="1421" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Error / review activity becomes a visible signal.</text><text x="1083" y="1446" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No automatic golden-case or prompt promotion.</text><text x="1083" y="1471" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Human review workflow remains planned.</text><text x="60" y="1530" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Orders, profiles and decisions are synthetic. Reset clears all eight tables and rebuilds the seeded demo baseline.</text></svg>
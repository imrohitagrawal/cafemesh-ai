er><marker id="202B41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#202B41" stroke-width="1.5"/></marker><marker id="626D7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#626D7E" stroke-width="1.5"/></marker><marker id="285DA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#285DA0" stroke-width="1.5"/></marker><marker id="EDF4FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#EDF4FC" stroke-width="1.5"/></marker><marker id="506882" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#506882" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1560" rx="0" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="60" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#477453" text-anchor="start">CAFÉMESH AI  /  ARCHITECTURE</text><text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#202B41" text-anchor="start">Delivery · CI, deployment &amp; saved media</text><text x="60" y="141" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#626D7E" text-anchor="start">Build-time service use is separated from customer-request runtime behavior.</text><rect x="1320" y="31" width="220" height="34" rx="8" fill="#EDF4FC" stroke="transparent" stroke-width="1.5"/><text x="1430" y="54" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#285DA0" text-anchor="middle">CODE + DEPLOY DOCS</text><polyline points="60,1481 1540,1481" fill="none" stroke="#D8DFE8" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1527" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626D7E" text-anchor="start">CODE-REVIEWED  •  26 SEP 2026  •  SOURCE 76134e6</text><text x="1540" y="1527" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#202B41" text-anchor="end">08 / 09</text><rect x="60" y="185" width="700" height="115" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="200" width="4" height="85" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="215" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">GitHub source + locked dependencies</text><text x="83" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">quality.yml · push / PR / manual / weekly triggers</text><text x="83" y="271" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">uv.lock + package-lock.json · Dockerfile</text><rect x="60" y="410" width="700" height="215" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="425" width="4" height="185" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="440" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">GITHUB ACTIONS</text><text x="83" y="473" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">CI verification and supply-chain checks</text><text x="83" y="504" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">make verify: pytest + TypeScript + Vite build</text><text x="83" y="529" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">make demo-smoke: two synthetic connected journeys</text><text x="83" y="554" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">npm audit + pip-audit · deployment-container build</text><text x="83" y="579" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Parallel job: Gitleaks over repository and history</text><text x="83" y="604" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">These checks do not deploy to Cloud Run.</text><polyline points="410,300 410,410" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="60" y="775" width="700" height="150" rx="14" fill="#FFF3E6" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="790" width="4" height="120" rx="2" fill="#B86023" stroke="transparent" stroke-width="1.5"/><text x="83" y="805" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">Manual release / source deployment</text><text x="83" y="836" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Documented gcloud run deploy --source . command</text><text x="83" y="861" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Cloud Build builds the source-deploy image.</text><text x="83" y="886" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Post-deploy health, auth and media checks are documented.</text><polyline points="410,625 410,775" fill="none" stroke="#B86023" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#B86023)"/><rect x="289.8125" y="688" width="240.375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="410" y="705" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#B86023" text-anchor="middle">Operator initiates deployment</text><rect x="60" y="1080" width="700" height="180" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="1095" width="4" height="150" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="1110" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">Cloud Run runtime</text><text x="83" y="1141" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">FastAPI + SPA + saved audio / video / poster assets</text><text x="83" y="1166" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Deployment docs specify ADC and scoped runtime roles.</text><text x="83" y="1191" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Firestore and Vertex access; Maps key via Secret Manager.</text><text x="83" y="1216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Cloudflare Worker routes the public custom hostname.</text><polyline points="410,925 410,1080" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="267.5546875" y="988" width="284.890625" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="410" y="1005" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Built image + runtime configuration</text><rect x="900" y="185" width="640" height="115" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="900" y="200" width="4" height="85" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="923" y="215" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Narration source + media scripts</text><text x="923" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Product / engineering narration and sanitized screenshot scenes</text><text x="923" y="271" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Prepared outside the customer request path.</text><rect x="900" y="410" width="640" height="160" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="900" y="425" width="4" height="130" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="923" y="440" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#7953AF" text-anchor="start">BUILD-TIME PROVIDER</text><text x="923" y="473" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Google Cloud Text-to-Speech</text><text x="923" y="504" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">generate_voiceover.py · Gemini-TTS · en-IN / Despina</text><text x="923" y="529" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">ADC-authenticated build-time synthesis</text><text x="923" y="554" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Paragraph segments + timing manifest; no runtime voice chat.</text><polyline points="1220,300 1220,410" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="900" y="675" width="640" height="110" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="900" y="690" width="4" height="80" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="923" y="705" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Saved narration assets</text><text x="923" y="736" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">MP3 audio + scene timing JSON</text><polyline points="1220,570 1220,675" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="900" y="885" width="640" height="150" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="900" y="900" width="4" height="120" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="923" y="915" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Screenshot + narration rendering</text><text x="923" y="946" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Sanitized captures; Chromium for engineering slide renders.</text><text x="923" y="971" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">FFmpeg / ffprobe compose and check H.264 + AAC MP4s.</text><text x="923" y="996" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Paragraph-synchronized stills, not continuous recordings.</text><polyline points="1220,785 1220,885" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="900" y="1130" width="640" height="110" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="900" y="1145" width="4" height="80" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="923" y="1160" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Bundled static media</text><text x="923" y="1191" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">frontend/public/audio, videos and images → Vite build</text><polyline points="1220,1035 1220,1130" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><polyline points="900,1185 760,1185" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="795.890625" y="1152" width="66.21875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="829" y="1169" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Bundle</text><polyline points="1540,730 1570,730 1570,1185 1540,1185" fill="none" stroke="#788494" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#788494)"/><text x="60" y="1370" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Google TTS is used to create assets. Browser playback reads bundled MP3 / MP4 files and makes no synthesis call.</text><text x="60" y="1400" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Existing CI is verification-only. Protected deployment promotion, image attestations, canary gates and rollback drills are target work.</text><text x="60" y="1430" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Recorded release evidence is historical; this architecture audit did not rerun live provider, deployment or browser-permission tests.</text><polyline points="60,1450 103,1450" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><text x="116" y="1456" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Application / data flow</text><polyline points="410,1450 453,1450" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><text x="466" y="1456" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">AI / advisory exchange</text><rect x="790" y="1441" width="20" height="20" rx="5" fill="#FFF3E6" stroke="#B86023" stroke-width="1.5"/><text x="822" y="1456" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Human decision</text><rect x="1090" y="1441" width="20" height="20" rx="5" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><text x="1122" y="1456" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">External system / local mode</text></svg>
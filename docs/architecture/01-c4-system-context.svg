ulated orders.</text><text x="83" y="624" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Record accept / reject decisions.</text><rect x="60" y="745" width="310" height="155" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="760" width="4" height="125" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="775" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">PERSON</text><text x="83" y="808" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Café owner</text><text x="83" y="839" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Inspect windowed demo metrics.</text><text x="83" y="864" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Read a grounded owner brief.</text><rect x="565" y="400" width="420" height="330" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="565" y="415" width="4" height="300" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="588" y="430" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">SOFTWARE SYSTEM</text><text x="588" y="463" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#202B41" text-anchor="start">CaféMesh AI</text><text x="588" y="494" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Discovery and menu guidance.</text><text x="588" y="519" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Synthetic orders and operations.</text><text x="588" y="544" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Shared owner insight and learning.</text><text x="588" y="569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Hosted state in Cloud Firestore.</text><text x="588" y="594" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Four browser workspaces;</text><text x="588" y="619" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">one backend application.</text><rect x="1220" y="190" width="320" height="155" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1220" y="205" width="4" height="125" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="1243" y="220" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">EXTERNAL IDENTITY SERVICE</text><text x="1243" y="253" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Google Identity</text><text x="1243" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Sign-in and reviewer ID tokens.</text><text x="1243" y="309" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No staff / tenant RBAC yet.</text><rect x="1220" y="410" width="320" height="155" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1220" y="425" width="4" height="125" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="1243" y="440" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#788494" text-anchor="start">EXTERNAL DATA SERVICE</text><text x="1243" y="473" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Google Maps</text><text x="1243" y="504" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Places directory search.</text><text x="1243" y="529" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Walking Routes to first result.</text><rect x="1220" y="630" width="320" height="155" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1220" y="645" width="4" height="125" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="1243" y="660" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#7953AF" text-anchor="start">EXTERNAL MODEL SERVICE</text><text x="1243" y="693" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Vertex AI / Gemini</text><text x="1243" y="724" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Optional advisory inference.</text><text x="1243" y="749" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">ADK runs inside the application.</text><rect x="1220" y="850" width="320" height="155" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1220" y="865" width="4" height="125" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1243" y="880" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#285DA0" text-anchor="start">MANAGED PERSISTENCE SERVICE</text><text x="1243" y="913" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#202B41" text-anchor="start">Cloud Firestore</text><text x="1243" y="944" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#626D7E" text-anchor="start">Read / persist synthetic records.</text><text x="1243" y="969" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">One bounded snapshot document.</text><polyline points="370,318 465,318 465,455 565,455" fill="non
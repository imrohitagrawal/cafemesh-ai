ont-weight="400" fill="#626D7E" text-anchor="middle">Search / route</text><polyline points="985,610 1120,610 1120,708 1220,708" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="1027.125" y="678" width="155.75" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1105" y="695" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Bounded inference</text><polyline points="985,700 1050,700 1050,928 1220,928" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><rect x="1025.1953125" y="898" width="159.609375" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="1105" y="915" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="middle">Read / persist state</text><text x="60" y="1075" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Cloud Firestore is an explicit managed dependency here; L2 and view 06 explain the internal snapshot adapter and record model.</text><text x="60" y="1105" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Cloud Run, Cloudflare and Secret Manager: view 02. Build-time Google TTS, media and release tooling: view 08.</text><text x="60" y="1135" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Maps listings are live directory data. Menu, allergen, inventory, occupancy, orders and manager decisions remain synthetic.</text><polyline points="60,1165 103,1165" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><text x="116" y="1171" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Application / data flow</text><polyline points="410,1165 453,1165" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><text x="466" y="1171" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">AI / advisory exchange</text><rect x="790" y="1156" width="20" height="20" rx="5" fill="#FFF3E6" stroke="#B86023" stroke-width="1.5"/><text x="822" y="1171" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">Human decision</text><rect x="1090" y="1156" width="20" height="20" rx="5" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><text x="1122" y="1171" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#626D7E" text-anchor="start">External system / local mode</text></svg>
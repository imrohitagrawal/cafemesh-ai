<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" role="img"><title>CaféMesh AI — 07-agent-execution</title><defs><marker id="F3F5F8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#F3F5F8" stroke-width="1.5"/></marker><marker id="7953AF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#7953AF" stroke-width="1.5"/></marker><marker id="D8DFE8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#D8DFE8" stroke-width="1.5"/></marker><marker id="FFFFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></marker><marker id="F5F0FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#F5F0FC" stroke-width="1.5"/></marker><marker id="FFF3E6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#FFF3E6" stroke-width="1.5"/></marker><marker id="B86023" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#B86023" stroke-width="1.5"/></marker><marker id="788494" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#788494" stroke-width="1.5"/></marker><marker id="477453" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#477453" stroke-width="1.5"/></marker><marker id="202B41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#202B41" stroke-width="1.5"/></marker><marker id="626D7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#626D7E" stroke-width="1.5"/></marker><marker id="285DA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#285DA0" stroke-width="1.5"/></marker><marker id="EDF4FC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#EDF4FC" stroke-width="1.5"/></marker><marker id="506882" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#506882" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1530" rx="0" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="60" y="49" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#477453" text-anchor="start">CAFÉMESH AI  /  ARCHITECTURE</text><text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#202B41" text-anchor="start">Agents · Actual execution paths</text><text x="60" y="141" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#626D7E" text-anchor="start">Four ADK definitions, parallel recommendation helpers, and the separate owner-brief path.</text><rect x="1320" y="31" width="220" height="34" rx="8" fill="#EDF4FC" stroke="transparent" stroke-width="1.5"/><text x="1430" y="54" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#285DA0" text-anchor="middle">CURRENT CODE</text><polyline points="60,1451 1540,1451" fill="none" stroke="#D8DFE8" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1497" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626D7E" text-anchor="start">CODE-REVIEWED  •  26 SEP 2026  •  SOURCE 76134e6</text><text x="1540" y="1497" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#202B41" text-anchor="end">07 / 09</text><rect x="60" y="185" width="940" height="120" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="200" width="4" height="90" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="83" y="215" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">POST /api/recommend</text><text x="83" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Run deterministic recommendation first. Skip generation when no candidates exist.</text><text x="83" y="271" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Use live ADK only when an API key or Vertex AI mode is configured.</text><rect x="1080" y="185" width="460" height="120" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1080" y="200" width="4" height="90" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1103" y="215" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">GET /api/owner</text><text x="1103" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Reviewer auth · window 1–365 days</text><text x="1103" y="271" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Compute shared-record metrics first.</text><rect x="60" y="420" width="430" height="160" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="435" width="4" height="130" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="83" y="450" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">TasteSafetyAgent</text><text x="83" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Fixed menu/safety helper prompt.</text><text x="83" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Instructed to call menu_facts().</text><text x="83" y="531" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No eligibility or order-write authority.</text><rect x="570" y="420" width="430" height="160" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="570" y="435" width="4" height="130" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="593" y="450" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">VisitOrderAgent</text><text x="593" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Fixed queue/seating helper prompt.</text><text x="593" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Instructed to call visit_facts().</text><text x="593" y="531" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No preview or confirmation tool.</text><polyline points="330,305 330,365 275,365 275,420" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><polyline points="730,305 730,365 785,365 785,420" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="393.9609375" y="348" width="272.078125" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="530" y="365" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Parallel invocation: asyncio.gather</text><rect x="60" y="660" width="430" height="105" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="60" y="675" width="4" height="75" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="83" y="690" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">menu_facts()</text><text x="83" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Reads fields from data.MENU.</text><rect x="570" y="660" width="430" height="105" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="570" y="675" width="4" height="75" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="593" y="690" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">visit_facts()</text><text x="593" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Reads data.QUEUE and data.ZONES.</text><polyline points="275,580 275,660" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><polyline points="785,580 785,660" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="260" y="910" width="540" height="190" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="260" y="925" width="4" height="160" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="283" y="940" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#7953AF" text-anchor="start">FOURTH ADK DEFINITION</text><text x="283" y="973" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202B41" text-anchor="start">ConciergeAgent</text><text x="283" y="1004" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Receives user text, authoritative candidates,</text><text x="283" y="1029" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">queue facts and both helper outputs.</text><text x="283" y="1054" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Root definition registers all three sub-agents.</text><text x="283" y="1079" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Runs through a fresh InMemoryRunner session.</text><polyline points="275,765 275,835 385,835 385,910" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><polyline points="785,765 785,835 675,835 675,910" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="360.0390625" y="821" width="339.921875" height="24" rx="5" fill="#FFFFFF" stroke="transparent" stroke-width="1.5"/><text x="530" y="838" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#7953AF" text-anchor="middle">Helper text + authoritative request context</text><rect x="1080" y="420" width="460" height="160" rx="14" fill="#F5F0FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1080" y="435" width="4" height="130" rx="2" fill="#7953AF" stroke="transparent" stroke-width="1.5"/><text x="1103" y="450" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">OpsOwnerAgent</text><text x="1103" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Invoked directly for the owner brief.</text><text x="1103" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Must call owner_facts(days).</text><text x="1103" y="531" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Read-only; no operational write tools.</text><polyline points="1310,305 1310,420" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="1080" y="660" width="460" height="125" rx="14" fill="#F3F5F8" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1080" y="675" width="4" height="95" rx="2" fill="#788494" stroke="transparent" stroke-width="1.5"/><text x="1103" y="690" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">owner_facts(days)</text><text x="1103" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Validates 1–365 day window.</text><text x="1103" y="746" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Calls service.metrics(days) over shared state.</text><polyline points="1310,580 1310,660" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="1080" y="910" width="460" height="190" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1080" y="925" width="4" height="160" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1103" y="940" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#202B41" text-anchor="start">Owner completion gate</text><text x="1103" y="971" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">main.py requires completed owner_facts</text><text x="1103" y="996" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">and non-empty generated text.</text><text x="1103" y="1021" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Failure returns an explicit error.</text><text x="1103" y="1046" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">This is not numeric fact-checking of prose.</text><polyline points="1310,785 1310,910" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><rect x="260" y="1200" width="540" height="130" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="260" y="1215" width="4" height="100" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="283" y="1230" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">Recommendation response guard</text><text x="283" y="1261" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Withhold declared allergy / safety-language prose.</text><text x="283" y="1286" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Structured candidates remain authoritative.</text><text x="283" y="1311" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Record outcomes, latency, evidence and guard activity.</text><rect x="1080" y="1200" width="460" height="130" rx="14" fill="#EDF4FC" stroke="#D8DFE8" stroke-width="1.5"/><rect x="1080" y="1215" width="4" height="100" rx="2" fill="#285DA0" stroke="transparent" stroke-width="1.5"/><text x="1103" y="1230" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#202B41" text-anchor="start">Owner response</text><text x="1103" y="1261" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Computed metrics + optional generated brief.</text><text x="1103" y="1286" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">No credentials: deterministic demo brief.</text><text x="1103" y="1311" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Recorded owner tool outcome is separate.</text><polyline points="530,1100 530,1200" fill="none" stroke="#7953AF" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7953AF)"/><polyline points="1310,1100 1310,1200" fill="none" stroke="#506882" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#506882)"/><text x="60" y="1400" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">ADK session state is in memory; selected activity is persisted separately. No durable workflow engine or generalized agent harness exists.</text><text x="60" y="1430" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#626D7E" text-anchor="start">Recommendation helpers are prompted to use tools, but tool completion is not enforced there; the owner path enforces it. See audit.</text></svg>
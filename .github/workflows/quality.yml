name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  verification:
    name: Tests, build, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --prefix frontend
      - name: Run backend, type, and production build checks
        run: make verify
      - name: Rehearse connected synthetic journey
        run: make demo-smoke
      - name: Audit JavaScript dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Export locked Python runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/cafemesh-requirements.txt
      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict --requirement /tmp/cafemesh-requirements.txt
      - name: Build deployment container
        run: docker build --tag cafemesh-ai:ci .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository and history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

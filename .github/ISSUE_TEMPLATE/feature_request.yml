name: Feature proposal
description: Propose a concrete user outcome or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: User and desired outcome
      description: Who needs this, and what task should they be able to complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and current gap
      description: Link the capability matrix or roadmap where relevant. Separate implemented demo behavior from the proposed capability.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable success, failure/recovery behavior, and evidence needed to claim completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and alternatives
      description: Include required data ownership, integrations or permissions; do not post credentials or personal data.

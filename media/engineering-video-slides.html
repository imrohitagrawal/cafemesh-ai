<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f3f1eb;color:#183b32;font-family:Arial,sans-serif}.slide{position:relative;height:720px;padding:36px 52px 44px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 88% 9%,#e6dabc 0,transparent 35%),#f3f1eb}.top,.foot{display:flex;justify-content:space-between;align-items:center}.top{color:#708078;font-size:14px;letter-spacing:1.7px;font-weight:bold;height:38px}.brand{font-size:20px;letter-spacing:0;color:#19392f}.content{display:grid;grid-template-columns:1fr 540px;gap:30px;align-items:center;min-height:0;flex:1;padding:16px 0}.copy{min-width:0}.hero{font-size:43px;line-height:1.1;letter-spacing:-1.4px;max-width:620px;font-weight:700}.sub{font-size:19px;line-height:1.45;color:#53675d;max-width:620px;margin-top:17px}.capture{margin:0;background:#fffdf8;border:1px solid #d9ded7;border-radius:15px;padding:9px;box-shadow:0 14px 36px #20382a17}.capture img{display:block;width:100%;height:304px;object-fit:contain;background:#f3f1eb;border-radius:9px}.capture figcaption{font-size:11px;line-height:1.3;color:#68756c;margin:8px 3px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#fffdf8;border:1px solid #e4e0d7;border-radius:13px;padding:12px 13px;box-shadow:0 12px 40px #20382a0c}.tag{color:#8b7148;font-size:11px;font-weight:bold;letter-spacing:1px}.box b{display:block;font-size:17px;margin:6px 0;color:#254b3d}.box p{font-size:13px;line-height:1.4;color:#68756c;margin:0}.row{display:flex;align-items:center;justify-content:flex-start;gap:7px;flex-wrap:wrap;margin-top:14px}.node{background:#fffdf8;border:1px solid #dddcd2;border-radius:11px;padding:11px 10px;text-align:center;font-size:12px;line-height:1.3;font-weight:bold;min-width:95px;flex:1}.node small{font-size:10px}.arrow{font-size:19px;color:#c18d4d}.foot{color:#758178;font-size:12px;border-top:1px solid #ddd9cf;padding-top:10px;height:28px}.l </style></head><body><main class="slide" id="root"></main><script>
const s=[
['ENGINEERING WALKTHROUGH · CAFÉMESH AI','From business workflow to trusted operations.','Agent behavior, data boundaries, evaluation, observability, and deployment readiness.','Public Google Cloud demo · synthetic café records'],
['DEPLOYMENT ARCHITECTURE','One product. Shared services and facts.','<div class="row"><div class="node">React + TypeScript<br><small>Customer · Ops · Owner · Vision</small></div><span class="arrow">→</span><div class="node">FastAPI<br><small>policy · tools · adapters</small></div><span class="arrow">→</span><div class="node">Firestore demo store<br><small>SQLite local mode</small></div></div>','Cloud Run · cafemesh.stackclimb.com'],
['FOUR ADK AGENTS · NARROW RESPONSIBILITIES','Agents interpret; backend code decides.','<div class="grid"><div class="box"><span class="tag">COORDINATE</span><b>Concierge</b><p>Intent and workflow routing</p></div><div class="box"><span class="tag">GROUND</span><b>TasteSafety</b><p>Menu and safety evidence</p></div><div class="box"><span class="tag">PLAN</span><b>VisitOrder</b><p>Timing and order proposal</p></div></div>','OpsOwner supplies read-only operational and owner context'],
['RETRIEVAL · CHOOSE THE RIGHT TOOL','Structured facts are not document search.','Exact menu terms and small lexical synonyms find candidates. Deterministic filters check price, allergens, stock, temperature, and timing.','Current: structured retrieval · no embeddings or RAG'],
['LIVE QUALITY FINDING · CORRECTED','A fluent answer can drift on a hard constraint.','A live response misstated an allergy and visit time. Allergy-context summaries are now withheld; structured evidence and policy decisions stay visible.','Versioned golden cases cover espresso, unsupported smoothie, and severe peanut constraints'],
['AGENT WORKFLOW · TOOLS AND EVIDENCE','Retrieve, validate, explain, observe.','<div class="row"><div class="node">User intent</div><span class="arrow">→</span><div class="node">ADK fact tools</div><span class="arrow">→</span><div class="node">Deterministic policy</div><span class="arrow">→</span><div class="node">Grounded result</div></div>','Tool outcomes · evidence IDs · latency · provider status · errors'],
['ACTION BOUNDARIES','Preview is not an order. Decision is not execution.','<div class="row"><div class="node">Proposal</div><span class="arrow">→</span><div class="node">Revalidate facts</div><span class="arrow">→</span><div class="node">Explicit confirmation</div><span class="arrow">→</span><div class="node">Demo order</div></div>','Idempotency · exact-preview binding · audited manager decisions'],
['MAPS AND LOCATION','Live discovery with permission and provenance.','Places listings and Routes estimates start at Indiranagar Metro Station or a typed area; one-time current location is opt-in.','No coordinate persistence · business menu remains separate synthetic data'],
['OPERATIONS OBSERVABILITY','Persisted signals, not decorative totals.','Order state · stock/safety alerts · provider health · tool latency/errors · review queue · measured preparation calibration','Demo window since reset · not a production SLO'],
['OWNER INTELLIGENCE','Metrics from the same shared records.','Explicit windows and formulas · unavailable metrics show insufficient data · no causal claims from correlation','Customer, Ops and Owner share the Firestore demo state'],
['VERIFICATION · BOUNDED CLAIMS','Run the gates; state exactly what they cover.','29 backend tests · 3 versioned menu goldens · synthetic journey rehearsals · TypeScript check · production build','No LLM-as-judge pipeline · no broad semantic/RAG benchmark'],
['NO LLM JUDGE CLAIM','Model judging needs calibration against people.','There is no LLM-as-a-judge pipeline in this release. Future judges should score groundedness and completeness against human-labeled examples.','Use agreement as a quality signal, never as the authority for safety'],
['THREE CONTROLLED LEARNING LOOPS','Taste adapts. Safety rules do not.','Explicit taste feedback changes bounded preferences; measured prep outcomes tune estimates; AI failures become human-reviewed candidates.','Production prompts and permissions never update automatically'],
['PILOT READINESS · FUTURE RAG','Build the data and governance before expanding agents.','Tenant and staff roles · verified menus · transactional inventory · customer consent · support and recovery. Add read-only RAG for long café documents when governed sources exist.','Future: reservations · groups · POS/payments · forecasts · BigQuery · Model Armor']
];let i=Math.min(s.length-1,Math.max(0,Number(new URLSearchParams(location.search).get('scene')||0))),x=s[i],shot=`provided-app-screenshots/engineering/scene-${String(i).padStart(2,'0')}.png`;document.title='CaféMesh AI Engineering Walkthrough';document.getElementById('root').innerHTML=`<div class="top"><span class="brand">☕ cafémesh</span><span>${x[0]}</span></div><section class="content"><div class="copy"><div class="hero">${x[1]}</div><div class="sub">${x[2]}</div></div><figure class="capture"><img src="${shot}" alt="Sanitized CaféMesh application capture for this narrated engineering section"><figcaption>ACTUAL CAFÉMESH CAPTURE · paired with this engineering topic · synthetic café data</figcaption></figure></section><div class="foot"><span>${x[3]}</span><span>${String(i+1).padStart(2,'0')} / ${String(s.length).padStart(2,'0')}</span></div><div class="license-strip">StackClimb's CaféMesh AI software  |  (c) 2026 Rohit Agrawal  |  GitHub github.com/imrohitagrawal  |  LinkedIn linkedin.com/in/rohitagrawal14</div>`;
</script></body></html>

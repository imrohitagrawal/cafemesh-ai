<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;background:#f4f0e8;color:#19392f;font-family:Arial,sans-serif}.slide{height:720px;padding:62px 78px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 90% 8%,#e6d9ba 0,transparent 34%),#f4f0e8}.top{display:flex;align-items:center;justify-content:space-between;color:#62756b;font-size:16px;letter-spacing:2px;font-weight:bold}.brand{font-size:22px;color:#19392f;letter-spacing:0}.hero{font-size:56px;line-height:1.08;letter-spacing:-2px;max-width:1040px;font-weight:700}.sub{font-size:24px;line-height:1.48;color:#53665c;max-width:1050px}.card{background:#fffdf8;border:1px solid #e2dfd5;border-radius:24px;padding:30px 36px;box-shadow:0 20px 65px #25392b12}.pill{display:inline-block;padding:10px 16px;margin:6px 8px 6px 0;background:#edf2e9;border-radius:20px;color:#315443;font-size:18px}.row{display:flex;gap:18px}.box{flex:1;border-radius:18px;background:#fffdf8;border:1px solid #e2dfd5;padding:22px 25px;font-size:21px;line-height:1.45}.tag{color:#7d5b39;font-size:15px;font-weight:bold;letter-spacing:1.4px}.large{font-size:30px;font-weight:bold;margin:10px 0}.foot{display:flex;justify-content:space-between;color:#77837a;font-size:15px;border-top:1px solid #ddd9cf;padding-top:16px}.alert{color:#8d492d;font-weight:bold}.green{color:#187357;font-weight:bold}.price{font-size:29px;font-weight:bold;color:#234f40}
</style></head><body><main class="slide" id="root"></main><script>
const s=[
['YOUR CAFÉ EXPERIENCE, INTELLIGENTLY CONNECTED','CaféMesh AI','One shared experience for guests, café teams, and owners.','LIVE PUBLIC DEMO · cafemesh.stackclimb.com'],
['CUSTOMER · ONE REQUEST, MANY CONSTRAINTS','A visit that fits your day.','40 minutes · vegetarian · severe peanut allergy · cold drink under ₹350 · quiet place to work','All constraints are explicit. Allergy rules never enter preference learning.'],
['LIVE DISCOVERY · USER IN CONTROL','Start near Indiranagar Metro Station.','Google Places café listings and Google Routes walking estimates. Type any area or opt in to one-time browser location.','Places listings are live; participating-café status and business data are separate'],
['GROUNDED MENU LOOKUP','Hot coffee and cold drinks.','Espresso · Americano · cappuccino · latte · masala chai · cold brew · matcha · frappe','Exact names + lexical synonyms, then deterministic fact filters · no RAG claim'],
['EVIDENCE BEFORE CONFIDENCE','Review candidate facts, not promises.','Structured candidates show price, ingredients, availability, menu source ID, timing, and safety-review reasons.','Unknown cross-contact means staff review · never “allergy-safe”'],
['CUSTOMER → OPERATIONS','Preview, confirm, then queue.','The guest reviews the precise item and price, confirms a simulated order, and sees it on the shared demo operations board.','Firestore-backed synthetic state · no café orders or payments'],
['OPERATIONS · SERVICE AND OBSERVABILITY','Help the team see what needs attention.','Queue · prep estimates · occupancy · low stock · safety review · provider/tool outcomes · latency','Manager decisions are audited separately from execution'],
['OWNER · NUMBERS FROM SHARED EVENTS','One story across the café.','Orders · average order value · preparation wait · repeat activity · recommendation conversion · feedback','Insufficient data stays visible · correlation is not causation'],
['LEARN RESPONSIBLY','Remember taste. Never learn safety rules.','Oat milk · lower sweetness · no caramel · quiet seating can shape a return visit.','Measured preparation outcomes and human-reviewed AI quality signals remain separate'],
['CONNECTED GOOGLE SERVICES','Live platform, synthetic business.','Cloud Run · Vertex AI + ADK · Google Places · Routes · Firestore · Google Sign-In · Gemini-TTS','OAuth reviewer access remains limited to listed testers while consent is in Testing'],
['FUTURE ROADMAP','Add capability when the evidence and systems are ready.','Café administration · versioned safety data · reservations · arrival sync · groups · service recovery · POS/payments/loyalty','Document RAG, voice chat, forecasting, BigQuery, Model Armor, multi-location intelligence'],
['THE CAFÉMESH LOOP','Better visits. Better operations.','Guest choices → team service → owner insight → a more useful return visit.','Grounded · observable · human-reviewed · designed to grow']
];let i=Math.min(s.length-1,Math.max(0,Number(new URLSearchParams(location.search).get('scene')||0))),x=s[i];document.title='CaféMesh AI Product Walkthrough';document.getElementById('root').innerHTML=`<div class="top"><span class="brand">☕ cafémesh</span><span>${x[0]}</span></div><div><div class="hero">${x[1]}</div><div class="sub" style="margin-top:25px">${x[2]}</div></div><div class="foot"><span>${x[3]}</span><span>${String(i+1).padStart(2,'0')} / ${String(s.length).padStart(2,'0')}</span></div>`;
</script></body></html>
